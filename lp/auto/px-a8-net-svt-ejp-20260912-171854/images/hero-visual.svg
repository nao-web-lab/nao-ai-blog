<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">コンセントに挿すだけの法人向けWi-Fiルーターから、電波が四方に広がり店舗やオフィスへ届くイメージ図</title>
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#123259"/>
      <stop offset="100%" stop-color="#0A1E38"/>
    </linearGradient>
    <linearGradient id="deviceBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4F6FA"/>
      <stop offset="100%" stop-color="#D9DFEA"/>
    </linearGradient>
    <radialGradient id="waveGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFA24D" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFA24D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="560" height="480" rx="28" fill="url(#heroBg)"/>

  <circle cx="280" cy="230" r="190" fill="url(#waveGlow)"/>

  <!-- radiating signal arcs -->
  <g fill="none" stroke="#FFB066" stroke-width="6" stroke-linecap="round" opacity="0.9">
    <path d="M280 230 m-70,0 a70,70 0 0 1 140,0"/>
    <path d="M280 230 m-110,0 a110,110 0 0 1 220,0" opacity="0.65"/>
    <path d="M280 230 m-150,0 a150,150 0 0 1 300,0" opacity="0.4"/>
  </g>

  <!-- wall outlet -->
  <rect x="230" y="330" width="100" height="70" rx="10" fill="#2B4568"/>
  <circle cx="262" cy="358" r="6" fill="#0A1E38"/>
  <circle cx="298" cy="358" r="6" fill="#0A1E38"/>
  <rect x="258" y="376" width="8" height="14" rx="2" fill="#0A1E38"/>
  <rect x="294" y="376" width="8" height="14" rx="2" fill="#0A1E38"/>

  <!-- router plug cable -->
  <path d="M280 330 L280 300" stroke="#8592A6" stroke-width="8" stroke-linecap="round"/>

  <!-- router device -->
  <g transform="translate(200,190)">
    <rect x="0" y="0" width="160" height="112" rx="18" fill="url(#deviceBody)" stroke="#B9C2D4" stroke-width="2"/>
    <rect x="18" y="20" width="124" height="10" rx="5" fill="#AEB8CB"/>
    <rect x="18" y="40" width="90" height="8" rx="4" fill="#C4CCDB"/>
    <circle cx="128" cy="80" r="10" fill="#FF8A3D"/>
    <circle cx="128" cy="80" r="4" fill="#FFF3E9"/>
  </g>

  <!-- small icons: shop / clock representing flexible use anywhere -->
  <g transform="translate(70,90)" fill="#F4F6FA" opacity="0.95">
    <rect x="0" y="24" width="70" height="46" rx="6"/>
    <path d="M-6 24 L35 -4 L76 24 Z" fill="#FFA24D"/>
    <rect x="28" y="46" width="14" height="24" fill="#123259"/>
  </g>

  <g transform="translate(410,120)" fill="none" stroke="#F4F6FA" stroke-width="5" stroke-linecap="round">
    <circle cx="35" cy="35" r="34" fill="#123259" stroke="#FFA24D" stroke-width="4"/>
    <path d="M35 18 L35 36 L50 44"/>
  </g>
</svg>
