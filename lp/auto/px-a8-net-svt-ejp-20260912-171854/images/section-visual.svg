<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img" aria-labelledby="sectionTitle">
  <title id="sectionTitle">店舗・イベント会場・仮設オフィスなど複数の設置シーンで同じルーター1台がWi-Fiを届けているイメージ図</title>
  <defs>
    <linearGradient id="skyBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF3E8"/>
      <stop offset="100%" stop-color="#F3E4CE"/>
    </linearGradient>
  </defs>

  <rect width="560" height="420" rx="24" fill="url(#skyBg)"/>
  <rect x="20" y="330" width="520" height="6" rx="3" fill="#E3CFAE"/>

  <!-- Scene 1: retail shop -->
  <g transform="translate(40,180)">
    <rect x="0" y="60" width="120" height="90" fill="#123259"/>
    <path d="M-10 60 L60 10 L130 60 Z" fill="#0A1E38"/>
    <rect x="20" y="90" width="30" height="60" fill="#F4F6FA"/>
    <rect x="70" y="90" width="30" height="30" fill="#FFA24D"/>
    <text x="60" y="176" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="16" fill="#123259">店舗</text>
  </g>

  <!-- Scene 2: pop-up event tent -->
  <g transform="translate(220,190)">
    <path d="M0 80 L60 20 L120 80 Z" fill="#FF8A3D"/>
    <path d="M0 80 L60 20 L60 80 Z" fill="#E67A30"/>
    <rect x="10" y="80" width="100" height="40" fill="#F4F6FA" stroke="#E3CFAE" stroke-width="2"/>
    <text x="60" y="146" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="16" fill="#123259">イベント会場</text>
  </g>

  <!-- Scene 3: temporary office / container -->
  <g transform="translate(400,190)">
    <rect x="0" y="40" width="120" height="80" rx="6" fill="#4A6180"/>
    <rect x="14" y="56" width="34" height="26" fill="#F4F6FA"/>
    <rect x="60" y="56" width="34" height="26" fill="#F4F6FA"/>
    <rect x="46" y="90" width="28" height="30" fill="#0A1E38"/>
    <text x="60" y="146" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="16" fill="#123259">仮設オフィス</text>
  </g>

  <!-- single router radiating to all three scenes -->
  <g transform="translate(255,70)">
    <rect x="0" y="0" width="50" height="34" rx="8" fill="#FFFFFF" stroke="#D9C4A0" stroke-width="2"/>
    <circle cx="40" cy="17" r="4" fill="#FF8A3D"/>
  </g>
  <g fill="none" stroke="#FF8A3D" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round" opacity="0.85">
    <path d="M270 104 L100 190"/>
    <path d="M280 104 L280 190"/>
    <path d="M290 104 L460 190"/>
  </g>
</svg>
