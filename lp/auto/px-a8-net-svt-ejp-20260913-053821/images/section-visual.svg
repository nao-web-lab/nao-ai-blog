<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-labelledby="sectionTitle">
  <title id="sectionTitle">相談から開通までの流れと電話加入権の仕組みを表す図解</title>

  <rect x="0" y="0" width="420" height="380" rx="24" fill="#F1EBDC"/>

  <!-- step 1: phone consult -->
  <g transform="translate(40,50)">
    <circle cx="30" cy="30" r="30" fill="#1F4A3D"/>
    <path d="M18 18c3-3 7-3 9 0l4 5c2 2 1 5-1 7l-2 2c2 6 6 10 12 12l2-2c2-2 5-3 7-1l5 4c3 2 3 6 0 9-6 6-16 5-24-1-8-6-15-16-15-25 0-4 1-7 3-10z" fill="#FBF8F1" transform="translate(2,2) scale(0.55)"/>
    <text x="30" y="70" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="12" font-weight="700" fill="#23291F">1. 無料相談</text>
  </g>

  <path d="M100 80h60" stroke="#C98A2C" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>

  <!-- step 2: application form -->
  <g transform="translate(170,50)">
    <circle cx="30" cy="30" r="30" fill="#1F4A3D"/>
    <rect x="16" y="14" width="28" height="32" rx="3" fill="#FBF8F1"/>
    <path d="M21 22h18M21 29h18M21 36h12" stroke="#1F4A3D" stroke-width="2.4" stroke-linecap="round"/>
    <text x="30" y="70" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="12" font-weight="700" fill="#23291F">2. 申し込み</text>
  </g>

  <path d="M230 80h60" stroke="#C98A2C" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>

  <!-- step 3: installer -->
  <g transform="translate(300,50)">
    <circle cx="30" cy="30" r="30" fill="#1F4A3D"/>
    <path d="M18 40l8-8 4 4-8 8zM24 30l10-10a4 4 0 0 1 6 6L30 36" stroke="#FBF8F1" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="30" y="70" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="12" font-weight="700" fill="#23291F">3. 設置工事</text>
  </g>

  <path d="M100 80v50" stroke="#C98A2C" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
  <path d="M100 130q0 20 20 20h180q20 0 20-20" stroke="#C98A2C" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round" fill="none"/>
  <path d="M320 80v50" stroke="#C98A2C" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>

  <!-- step 4: connected -->
  <g transform="translate(150,170)">
    <rect x="0" y="0" width="120" height="70" rx="14" fill="#1F4A3D"/>
    <path d="M20 35c6-14 18-22 40-22s34 8 40 22" stroke="#E9C87A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="60" cy="35" r="5" fill="#E9C87A"/>
    <text x="60" y="90" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="13" font-weight="700" fill="#123128">4. 開通・利用開始</text>
  </g>

  <text x="210" y="300" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="13" fill="#52594B">
    相談 → 申し込み → 工事 → 開通の順に進みます
  </text>
  <text x="210" y="322" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="12" fill="#7A806E">
    回線の種類により、電話加入権の要否が異なります
  </text>
</svg>
