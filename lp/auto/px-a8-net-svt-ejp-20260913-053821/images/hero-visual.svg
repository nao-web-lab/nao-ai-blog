<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">受話器と回線がつながるイメージ図</title>
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E6B54"/>
      <stop offset="100%" stop-color="#123128"/>
    </linearGradient>
  </defs>

  <rect x="10" y="10" width="460" height="400" rx="28" fill="url(#heroBg)"/>

  <!-- connection arcs -->
  <g fill="none" stroke="#E9C87A" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <path d="M150 210a90 90 0 0 1 180 0"/>
    <path d="M175 210a65 65 0 0 1 130 0"/>
    <path d="M200 210a40 40 0 0 1 80 0"/>
  </g>

  <!-- handset -->
  <g transform="translate(190,150)">
    <path d="M20 40c8-18 26-32 48-32l8 0c6 0 10 5 9 11l-3 16c-1 5-5 8-10 8-10 0-19 6-24 15-6 11-6 24 0 35 5 9 14 15 24 15 5 0 9 3 10 8l3 16c1 6-3 11-9 11l-8 0c-22 0-40-14-48-32-8-18-8-40 0-56z" fill="#FBF8F1"/>
  </g>

  <!-- four line-type chips -->
  <g font-family="'Noto Sans JP', sans-serif" font-size="13" font-weight="700" fill="#123128">
    <rect x="48" y="300" width="90" height="34" rx="17" fill="#F1EBDC"/>
    <text x="93" y="322" text-anchor="middle">ひかり電話</text>

    <rect x="150" y="300" width="70" height="34" rx="17" fill="#F1EBDC"/>
    <text x="185" y="322" text-anchor="middle">ISDN</text>

    <rect x="232" y="300" width="90" height="34" rx="17" fill="#F1EBDC"/>
    <text x="277" y="322" text-anchor="middle">アナログ</text>

    <rect x="334" y="300" width="100" height="34" rx="17" fill="#F1EBDC"/>
    <text x="384" y="322" text-anchor="middle">加入電話</text>
  </g>

  <text x="240" y="365" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="14" fill="#C9D2C6">
    状況に合わせて回線タイプを選べます
  </text>
</svg>
