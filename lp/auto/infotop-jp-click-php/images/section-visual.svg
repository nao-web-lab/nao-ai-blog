<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="sectionVisualTitle">
  <title id="sectionVisualTitle">コンピ指数表を確認し、条件に該当すれば馬連3点で勝負、該当しなければ見送るという実践の流れを示した図</title>

  <rect x="8" y="8" width="624" height="404" rx="24" fill="#FAF7EE" stroke="#DDE3D6" stroke-width="2"/>

  <g font-family="'Zen Kaku Gothic New','Noto Sans JP',sans-serif" font-weight="700">

    <!-- step 1 -->
    <rect x="220" y="30" width="200" height="52" rx="10" fill="#0F4A3C"/>
    <text x="320" y="62" text-anchor="middle" font-size="16" fill="#FFFFFF">コンピ指数表を確認</text>
    <line x1="320" y1="82" x2="320" y2="106" stroke="#8A968D" stroke-width="3"/>
    <path d="M312 100 L320 112 L328 100" fill="none" stroke="#8A968D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- step 2 -->
    <rect x="180" y="114" width="280" height="52" rx="10" fill="#0F4A3C"/>
    <text x="320" y="146" text-anchor="middle" font-size="16" fill="#FFFFFF">6R・9R・12Rの条件をチェック</text>
    <line x1="320" y1="166" x2="320" y2="190" stroke="#8A968D" stroke-width="3"/>
    <path d="M312 184 L320 196 L328 184" fill="none" stroke="#8A968D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- decision diamond -->
    <polygon points="320,198 400,238 320,278 240,238" fill="#FFFFFF" stroke="#C9A227" stroke-width="3"/>
    <text x="320" y="234" text-anchor="middle" font-size="14" fill="#1D241F">条件に</text>
    <text x="320" y="252" text-anchor="middle" font-size="14" fill="#1D241F">該当？</text>

    <!-- branch left: yes -->
    <line x1="248" y1="248" x2="160" y2="300" stroke="#0F4A3C" stroke-width="3"/>
    <text x="185" y="272" font-size="13" fill="#0F4A3C">該当</text>
    <rect x="60" y="304" width="200" height="56" rx="10" fill="#E7F0EA" stroke="#0F4A3C" stroke-width="2"/>
    <text x="160" y="329" text-anchor="middle" font-size="15" fill="#0F4A3C">勝負レース</text>
    <text x="160" y="349" text-anchor="middle" font-size="15" fill="#0F4A3C">馬連3点を購入</text>

    <!-- branch right: no -->
    <line x1="392" y1="248" x2="480" y2="300" stroke="#8A968D" stroke-width="3"/>
    <text x="440" y="272" font-size="13" fill="#57645C">非該当</text>
    <rect x="380" y="304" width="200" height="56" rx="10" fill="#F1EEE4" stroke="#B9C3BC" stroke-width="2"/>
    <text x="480" y="329" text-anchor="middle" font-size="15" fill="#57645C">その日は</text>
    <text x="480" y="349" text-anchor="middle" font-size="15" fill="#57645C">見送り</text>
  </g>
</svg>
