<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="ogImageTitle">
  <title id="ogImageTitle">今の電話番号も電話機も、そのまま使える「ひかり電話」紹介ページのアイキャッチ画像</title>

  <defs>
    <linearGradient id="ogBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A3D39"/>
      <stop offset="55%" stop-color="#0E7C77"/>
      <stop offset="100%" stop-color="#0A2A27"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ogBg)"/>

  <!-- 装飾の光ファイバー波線 -->
  <path d="M-40 470 C 120 420, 220 520, 380 470 C 540 420, 640 520, 800 470 C 960 420, 1060 520, 1240 470"
        fill="none" stroke="#FF8A57" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <path d="M-40 500 C 120 450, 220 550, 380 500 C 540 450, 640 550, 800 500 C 960 450, 1060 550, 1240 500"
        fill="none" stroke="#3FBBAF" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>

  <!-- PRラベル -->
  <rect x="80" y="76" width="96" height="34" rx="6" fill="#FF8A57"/>
  <text x="128" y="99" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="16" font-weight="700" fill="#2A1000">PR</text>

  <!-- サービスジャンルラベル -->
  <text x="80" y="168" font-family="'Noto Sans JP', sans-serif" font-size="22" letter-spacing="2" fill="#8FE3D8">IP PHONE SERVICE</text>

  <!-- メインコピー -->
  <text x="80" y="256" font-family="'Noto Sans JP', sans-serif" font-size="52" font-weight="700" fill="#FFFFFF">今の電話番号も電話機も、</text>
  <text x="80" y="326" font-family="'Noto Sans JP', sans-serif" font-size="52" font-weight="700" fill="#FFFFFF">そのまま使える「ひかり電話」</text>

  <text x="80" y="384" font-family="'Noto Sans JP', sans-serif" font-size="24" fill="#CDEDE8">光回線のIP電話サービスを、紹介ページでチェック</text>

  <!-- サイト名 -->
  <g transform="translate(80 540)">
    <rect x="0" y="0" width="36" height="36" rx="9" fill="#FFFFFF"/>
    <text x="18" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0E7C77">N</text>
    <text x="50" y="24" font-family="'Noto Sans JP', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">NAO WEB LAB</text>
  </g>
</svg>
