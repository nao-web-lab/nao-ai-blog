<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="ogImageTitle">
  <title id="ogImageTitle">Quanis メルティングエッセンスマスクとは？美容液100%のとろけるマスク｜NAO WEB LAB</title>
  <defs>
    <linearGradient id="ogBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A1B21"/>
      <stop offset="55%" stop-color="#5C2C3B"/>
      <stop offset="100%" stop-color="#33141C"/>
    </linearGradient>
    <radialGradient id="ogDropGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#E3A9B7"/>
      <stop offset="100%" stop-color="#B3556B"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ogBgGrad)"/>

  <!-- decorative rings -->
  <g fill="none" stroke="#C79A5B" stroke-width="2" opacity="0.35">
    <circle cx="980" cy="150" r="90"/>
    <circle cx="980" cy="150" r="130"/>
  </g>

  <!-- essence droplet motif -->
  <path d="M1000 90 C1030 130, 1050 155, 1050 185
