  <text x="90" y="230" font-family="Georgia, 'Noto Serif JP', serif" font-size="30" fill="#E0A9B8" letter-spacing="4">MELTING ESSENCE MASK</text>
  <text x="88" y="320" font-family="Georgia, 'Noto Serif JP', serif" font-size="64" font-weight="700" fill="#FFFFFF">Quanis メルティング</text>
  <text x="88" y="400" font-family="Georgia, 'Noto Serif JP', serif" font-size="64" font-weight="700" fill="#FFFFFF">エッセンスマスクとは</text>
  <text x="90" y="460" font-family="'Noto Sans JP', sans-serif" font-size="28" fill="#E8D6DA">美容液成分100%の、とろけるフェイスマスク</text>

  <g transform="translate(90,510)">
    <rect x="0" y="0" width="34" height="34" rx="8" fill="#B3556B"/>
    <text x="17" y="24" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">N</text>
    <text x="48" y="24" font-family="'Noto Sans JP', sans-serif" font-size="22" fill="#F7EAE4">NAO WEB LAB</text>
