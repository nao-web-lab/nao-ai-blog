<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="ogImageTitle">
  <title id="ogImageTitle">藤ノ井俊樹の「旬の厳選10銘柄」とは？四半期ごとの注目株情報サービスを紹介 - NAO WEB LAB</title>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#142850"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- 装飾：株価チャート風の折れ線 -->
  <polyline points="80,470 220,430 360,460 500,390 640,410 780,340 920,360 1060,300"
            fill="none" stroke="#D9B968" stroke-width="4" opacity="0.55"/>
  <g fill="#D9B968" opacity="0.7">
    <circle cx="220" cy="430" r="5"/>
    <circle cx="500" cy="390" r="5"/>
    <circle cx="780" cy="340" r="5"/>
    <circle cx="1060" cy="300" r="5"/>
  </g>

  <!-- PRタグ -->
  <rect x="80" y="90" width="90" height="34" rx="6" fill="#D9B968"/>
  <text x="125" y="113" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif" font-size="18" font-weight="700" fill="#1B1502" text-anchor="middle">PR</text>
  <text x="188" y="114" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif" font-size="18" fill="#C7D0E4">株式情報サービス紹介ページ</text>

  <!-- メイン見出し -->
  <text x="80" y="240" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif" font-size="52" font-weight="700" fill="#FFFFFF">藤ノ井俊樹の</text>
  <text x="80" y="320" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif" font-size="60" font-weight="700" fill="#FFFFFF">「旬の厳選10銘柄」</text>
  <text x="80" y="386" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif" font-size="34" font-weight="700" fill="#D9B968">とは？</text>

  <text x="80" y="440" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif" font-size="24" fill="#C7D0E4">四半期ごとに10銘柄を厳選して紹介する株式情報サービス</text>

  <!-- サイト名 -->
  <rect x="80" y="516" width="30" height="30" rx="7" fill="#142850" stroke="#D9B968" stroke-width="1.5"/>
  <text x="95" y="538" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">N</text>
  <text x="122" y="539" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif" font-size="22" font-weight="700" fill="#EDF1FA">NAO WEB LAB</text>
</svg>
