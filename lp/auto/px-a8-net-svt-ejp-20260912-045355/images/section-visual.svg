<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="sectionVisualTitle">
  <title id="sectionVisualTitle">「割安感」「企業の地力」「株価材料」という3つの視点で銘柄をふるいにかける様子を表した図解イラスト</title>

  <!-- 背景 -->
  <rect x="0" y="0" width="320" height="220" rx="16" fill="#EAEEF6"/>

  <!-- 3つの視点アイコン -->
  <g font-family="'Noto Sans JP', sans-serif" font-size="12" fill="#16202E" text-anchor="middle">
    <g>
      <circle cx="60" cy="48" r="26" fill="#FFFFFF" stroke="#142850" stroke-width="2"/>
      <circle cx="55" cy="44" r="9" fill="none" stroke="#142850" stroke-width="2"/>
      <line x1="61" y1="50" x2="68" y2="57" stroke="#142850" stroke-width="2" stroke-linecap="round"/>
      <text x="60" y="88">割安感</text>
    </g>
    <g>
      <circle cx="160" cy="48" r="26" fill="#FFFFFF" stroke="#142850" stroke-width="2"/>
      <path d="M160 34 L172 39 V48 C172 57 166 63 160 66 C154 63 148 57 148 48 V39 Z" fill="none" stroke="#142850" stroke-width="2"/>
      <text x="160" y="88">企業の地力</text>
    </g>
    <g>
      <circle cx="260" cy="48" r="26" fill="#FFFFFF" stroke="#142850" stroke-width="2"/>
      <path d="M260 34 L264 44 L274 46 L266 53 L268 63 L260 58 L252 63 L254 53 L246 46 L256 44 Z" fill="none" stroke="#142850" stroke-width="2"/>
      <text x="260" y="88">株価材料</text>
    </g>
  </g>

  <!-- 収束する漏斗（3つの視点で銘柄をふるいにかけるイメージ） -->
  <path d="M40 104 L280 104 L190 150 L130 150 Z" fill="#142850" opacity="0.08"/>
  <path d="M40 104 L280 104 L190 150 L130 150 Z" fill="none" stroke="#142850" stroke-width="1.5"/>

  <!-- 選び出された10銘柄（概念表現） -->
  <g fill="#B08A32">
    <circle cx="105" cy="182" r="6"/>
    <circle cx="127" cy="182" r="6"/>
    <circle cx="149" cy="182" r="6"/>
    <circle cx="171" cy="182" r="6"/>
    <circle cx="193" cy="182" r="6"/>
    <circle cx="105" cy="200" r="6"/>
    <circle cx="127" cy="200" r="6"/>
    <circle cx="149" cy="200" r="6"/>
    <circle cx="171" cy="200" r="6"/>
    <circle cx="193" cy="200" r="6"/>
  </g>
</svg>
