<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">光回線でつながる家とスマートフォン</title>
  <desc id="heroDesc">家庭のルーターから光ファイバーの速い通信線が伸び、スマートフォンとクラウドにつながっている様子を示したイメージ図</desc>
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B2E7A"/>
      <stop offset="100%" stop-color="#241C4D"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F2A93B"/>
      <stop offset="100%" stop-color="#FFD98A"/>
    </linearGradient>
  </defs>

  <rect width="640" height="480" rx="28" fill="url(#skyGrad)"/>

  <!-- soft node dots background -->
  <g fill="#5C4FA8" opacity="0.45">
    <circle cx="70" cy="60" r="3"/>
    <circle cx="120" cy="110" r="2"/>
    <circle cx="560" cy="80" r="3"/>
    <circle cx="590" cy="150" r="2"/>
    <circle cx="500" cy="40" r="2"/>
    <circle cx="60" cy="380" r="2"/>
    <circle cx="40" cy="420" r="3"/>
  </g>

  <!-- house -->
  <g transform="translate(90,230)">
    <polygon points="0,70 70,20 140,70" fill="#F2A93B"/>
    <rect x="16" y="70" width="108" height="100" rx="6" fill="#FFFFFF"/>
    <rect x="40" y="110" width="26" height="60" rx="3" fill="#3B2E7A"/>
    <rect x="82" y="100" width="34" height="34" rx="3" fill="#D68F1E"/>
    <rect x="60" y="10" width="10" height="26" fill="#FFFFFF"/>
  </g>

  <!-- router inside house -->
  <g transform="translate(96,190)">
    <rect x="0" y="0" width="46" height="14" rx="4" fill="#241C4D"/>
    <circle cx="8" cy="7" r="2" fill="#7CF29E"/>
    <circle cx="18" cy="7" r="2" fill="#7CF29E"/>
  </g>

  <!-- speed beams from house to phone -->
  <g stroke="url(#beamGrad)" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M170 260 C 260 220, 330 220, 420 240"/>
    <path d="M170 285 C 270 260, 340 270, 430 275" opacity="0.6"/>
    <path d="M170 310 C 260 300, 330 310, 420 310" opacity="0.4"/>
  </g>

  <!-- cloud / network node -->
  <g transform="translate(360,120)">
    <ellipse cx="60" cy="40" rx="70" ry="34" fill="#FFFFFF" opacity="0.12"/>
    <ellipse cx="60" cy="40" rx="70" ry="34" fill="none" stroke="#FFD98A" stroke-width="2"/>
    <circle cx="30" cy="35" r="4" fill="#FFD98A"/>
    <circle cx="60" cy="25" r="4" fill="#FFD98A"/>
    <circle cx="90" cy="38" r="4" fill="#FFD98A"/>
    <line x1="30" y1="35" x2="60" y2="25" stroke="#FFD98A" stroke-width="1.5"/>
    <line x1="60" y1="25" x2="90" y2="38" stroke="#FFD98A" stroke-width="1.5"/>
  </g>

  <!-- smartphone receiving signal -->
  <g transform="translate(430,230)">
    <rect x="0" y="0" width="76" height="140" rx="14" fill="#FFFFFF"/>
    <rect x="8" y="14" width="60" height="102" rx="4" fill="#3B2E7A"/>
    <circle cx="38" cy="127" r="6" fill="#D68F1E"/>
    <g transform="translate(24,40)" stroke="#F2A93B" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M0 20 A 20 20 0 0 1 28 20"/>
      <path d="M6 26 A 12 12 0 0 1 22 26"/>
      <circle cx="14" cy="30" r="2.5" fill="#F2A93B" stroke="none"/>
    </g>
  </g>
</svg>
