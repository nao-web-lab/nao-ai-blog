<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">チャートを巻き戻しながら練習するイメージ図</title>
  <desc id="heroDesc">過去の値動きを再生・巻き戻し・速度調整しながら、ローソク足チャート上で仮の売買注文を検証する様子を表した図。実際のMT4画面ではない概念イラスト。</desc>
  <defs>
    <linearGradient id="heroPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B2432"/>
      <stop offset="100%" stop-color="#131A26"/>
    </linearGradient>
    <linearGradient id="heroGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#29D3C0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#29D3C0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="560" height="480" rx="28" fill="url(#heroPanel)"/>
  <circle cx="460" cy="80" r="140" fill="url(#heroGlow)"/>

  <!-- panel header bar -->
  <rect x="32" y="32" width="496" height="40" rx="10" fill="#0B0F17"/>
  <circle cx="56" cy="52" r="5" fill="#FF6B57"/>
  <circle cx="74" cy="52" r="5" fill="#FFB020"/>
  <circle cx="92" cy="52" r="5" fill="#29D3C0"/>
  <text x="450" y="57" font-family="'Noto Sans JP', sans-serif" font-size="14" fill="#98A4B3" text-anchor="end">練習モード</text>

  <!-- grid -->
  <g stroke="#26303F" stroke-width="1">
    <line x1="32" y1="140" x2="528" y2="140"/>
    <line x1="32" y1="200" x2="528" y2="200"/>
    <line x1="32" y1="260" x2="528" y2="260"/>
    <line x1="32" y1="320" x2="528" y2="320"/>
    <line x1="32" y1="380" x2="528" y2="380"/>
  </g>

  <!-- candlesticks -->
  <g stroke-width="2">
    <line x1="70" y1="300" x2="70" y2="360" stroke="#FF6B57"/>
    <rect x="60" y="310" width="20" height="35" fill="#FF6B57"/>

    <line x1="110" y1="270" x2="110" y2="330" stroke="#29D3C0"/>
    <rect x="100" y="280" width="20" height="30" fill="#29D3C0"/>

    <line x1="150" y1="240" x2="150" y2="310" stroke="#FF6B57"/>
    <rect x="140" y="250" width="20" height="40" fill="#FF6B57"/>

    <line x1="190" y1="220" x2="190" y2="290" stroke="#29D3C0"/>
    <rect x="180" y="230" width="20" height="35" fill="#29D3C0"/>

    <line x1="230" y1="190" x2="230" y2="260" stroke="#29D3C0"/>
    <rect x="220" y="200" width="20" height="35" fill="#29D3C0"/>

    <line x1="270" y1="210" x2="270" y2="280" stroke="#FF6B57"/>
    <rect x="260" y="220" width="20" height="35" fill="#FF6B57"/>

    <line x1="310" y1="170" x2="310" y2="240" stroke="#29D3C0"/>
    <rect x="300" y="180" width="20" height="35" fill="#29D3C0"/>

    <line x1="350" y1="150" x2="350" y2="220" stroke="#29D3C0"/>
    <rect x="340" y="160" width="20" height="35" fill="#29D3C0"/>

    <line x1="390" y1="180" x2="390" y2="250" stroke="#FF6B57"/>
    <rect x="380" y="190" width="20" height="35" fill="#FF6B57"/>

    <line x1="430" y1="140" x2="430" y2="210" stroke="#29D3C0"/>
    <rect x="420" y="150" width="20" height="35" fill="#29D3C0"/>
  </g>

  <!-- rewind / playback control bar -->
  <rect x="60" y="400" width="440" height="56" rx="28" fill="#0B0F17" stroke="#26303F"/>
  <g fill="#E7ECF2">
    <path d="M110 418 L96 428 L110 438 Z"/>
    <path d="M128 418 L114 428 L128 438 Z"/>
  </g>
  <circle cx="280" cy="428" r="16" fill="#29D3C0"/>
  <path d="M275 420 L275 436 L289 428 Z" fill="#0B0F17"/>
  <g fill="#98A4B3">
    <path d="M432 418 L446 428 L432 438 Z"/>
    <path d="M450 418 L464 428 L450 438 Z"/>
  </g>
  <text x="280" y="415" font-family="'Noto Sans JP', sans-serif" font-size="12" fill="#98A4B3" text-anchor="middle">20段階スピード調整</text>
</svg>
