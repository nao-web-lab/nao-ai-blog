<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">光ファイバーの光が一本の線となって、家のアイコンへ届く様子を表したイメージイラスト</title>
  <defs>
    <linearGradient id="heroGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C8CFF"/>
      <stop offset="100%" stop-color="#FF5C6C"/>
    </linearGradient>
    <radialGradient id="heroCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EEF1FF"/>
      <stop offset="100%" stop-color="#B9C2FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="120" cy="120" r="112" fill="url(#heroCore)"/>

  <!-- 光ファイバーの光の筋 -->
  <g stroke="url(#heroGlow)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M36 96 C70 80, 96 70, 120 118"/>
    <path d="M30 128 C68 118, 98 108, 120 128"/>
    <path d="M40 160 C72 138, 98 130, 120 138"/>
  </g>
  <g fill="#FF5C6C">
    <circle cx="36" cy="96" r="3.5"/>
    <circle cx="30" cy="128" r="3.5"/>
    <circle cx="40" cy="160" r="3.5"/>
  </g>

  <!-- 中央の分岐ポイント -->
  <circle cx="122" cy="128" r="7" fill="#2A3FDB"/>

  <!-- 家のアイコン -->
  <g transform="translate(140,96)">
    <path d="M0 40 L40 40 L40 78 L0 78 Z" fill="#FFFFFF" stroke="#2A3FDB" stroke-width="3"/>
    <path d="M-8 42 L20 14 L48 42" fill="none" stroke="#2A3FDB" stroke-width="3" stroke-linejoin="round"/>
    <rect x="14" y="54" width="12" height="24" fill="#EBF0FC" stroke="#2A3FDB" stroke-width="2.5"/>
    <rect x="4" y="50" width="8" height="8" fill="#FF5C6C"/>
  </g>

  <!-- 分岐から家までの接続線 -->
  <path d="M122 128 C132 116, 148 108, 160 100" stroke="#2A3FDB" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- 電波のリング -->
  <g stroke="#7C8CFF" stroke-width="2" fill="none" opacity="0.6">
    <path d="M182 78 a18 18 0 0 1 0 36"/>
    <path d="M190 70 a30 30 0 0 1 0 52"/>
  </g>
</svg>
