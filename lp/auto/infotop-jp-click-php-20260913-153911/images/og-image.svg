<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="ogTitle">
  <title id="ogTitle">素材探しと台本づくりに追われる時間を、投稿する時間に。アルファソートクリエイター ショート動画の動画素材＆テキスト原稿集 紹介ページ</title>
  <defs>
    <linearGradient id="ogBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171B33"/>
      <stop offset="100%" stop-color="#0A0C1A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#ogBg)"/>
  <g fill="#F3EFE6" opacity="0.6">
    <circle cx="90" cy="90" r="3"/>
    <circle cx="160" cy="150" r="2"/>
    <circle cx="1120" cy="80" r="3"/>
    <circle cx="1080" cy="180" r="2"/>
