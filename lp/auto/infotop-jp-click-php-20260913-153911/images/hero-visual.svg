<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">縦型ショート動画に4種類の素材が集まる様子</title>
  <desc id="heroDesc">スマートフォンの縦型ショート動画画面に、動画クリップ・画像・テキスト原稿・BGMのアイコンが周囲から集まっている図</desc>
  <defs>
    <linearGradient id="heroSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171B33"/>
      <stop offset="100%" stop-color="#0A0C1A"/>
    </linearGradient>
    <linearGradient id="heroPhone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A2F55"/>
      <stop offset="100%" stop-color="#171B33"/>
    </linearGradient>
    <radialGradient id="heroGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#9B7FD4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9B7FD4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="480" fill="url(#heroSky)"/>
  <circle cx="320" cy="230" r="220" fill="url(#heroGlow)"/>

  <!-- scattered stars -->
  <g fill="#F3EFE6" opacity="0.7">
    <circle cx="70" cy="70" r="2.2"/>
    <circle cx="120" cy="140" r="1.6"/>
    <circle cx="560" cy="90" r="2.2"/>
    <circle cx="590" cy="180" r="1.6"/>
    <circle cx="60" cy="360" r="1.8"/>
    <circle cx="580" cy="400" r="2"/>
    <circle cx="500" cy="60" r="1.4"/>
    <circle cx="90" cy="420" r="1.4"/>
  </g>

  <!-- smartphone -->
  <g transform="translate(230,90)">
    <rect x="0" y="0" width="180" height="320" rx="26" fill="url(#heroPhone)" stroke="#E0A94A" stroke-width="3"/>
    <rect x="14" y="18" width="152" height="284" rx="14" fill="#0A0C1A"/>
    <rect x="70" y="8" width="40" height="6" rx="3" fill="#E0A94A" opacity="0.8"/>
    <!-- vertical video frame inside phone -->
    <rect x="24" y="30" width="132" height="200" rx="8" fill="#20264A"/>
    <path d="M78 108 L104 130 L78 152 Z" fill="#E0A94A"/>
    <!-- text lines representing script -->
    <rect x="30" y="240" width="90" height="8" rx="4" fill="#9B7FD4" opacity="0.8"/>
    <rect x="30" y="256" width="120" height="8" rx="4" fill="#F3EFE6" opacity="0.5"/>
    <rect x="30" y="272" width="70" height="8" rx="4" fill="#F3EFE6" opacity="0.35"/>
  </g>

  <!-- floating asset icons converging on phone -->
  <g>
    <!-- video clip icon (top-left) -->
    <g transform="translate(90,60)">
      <rect x="0" y="0" width="56" height="42" rx="6" fill="none" stroke="#E0A94A" stroke-width="3"/>
      <path d="M20 12 L38 21 L20 30 Z" fill="#E0A94A"/>
    </g>
    <!-- image icon (top-right) -->
    <g transform="translate(470,70)">
      <rect x="0" y="0" width="58" height="44" rx="6" fill="none" stroke="#9B7FD4" stroke-width="3"/>
      <circle cx="16" cy="16" r="6" fill="#9B7FD4"/>
      <path d="M4 38 L22 22 L34 32 L54 14 L54 40 L4 40 Z" fill="#9B7FD4" opacity="0.8"/>
    </g>
    <!-- music note icon (bottom-left) -->
    <g transform="translate(80,340)">
      <circle cx="10" cy="46" r="10" fill="#F3EFE6" opacity="0.9"/>
      <circle cx="46" cy="38" r="10" fill="#F3EFE6" opacity="0.9"/>
      <path d="M20 46 V8 L56 0 V38" fill="none" stroke="#F3EFE6" stroke-width="4" opacity="0.9"/>
    </g>
    <!-- text/doc icon (bottom-right) -->
    <g transform="translate(460,330)">
      <rect x="0" y="0" width="50" height="60" rx="4" fill="none" stroke="#E0A94A" stroke-width="3"/>
      <rect x="10" y="14" width="30" height="5" fill="#E0A94A"/>
      <rect x="10" y="26" width="30" height="5" fill="#E0A94A" opacity="0.7"/>
      <rect x="10" y="38" width="20" height="5" fill="#E0A94A" opacity="0.5"/>
    </g>
    <!-- connecting dotted lines toward phone -->
    <g stroke="#F3EFE6" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.5" fill="none">
      <path d="M146 90 L232 130"/>
      <path d="M494 100 L410 140"/>
      <path d="M124 360 L232 300"/>
      <path d="M482 360 L410 300"/>
    </g>
  </g>
</svg>
