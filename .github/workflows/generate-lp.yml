name: Auto LP Generator (from phone)

on:
  workflow_dispatch:
    inputs:
      affiliate_url:
        description: "アフィリエイトURL(https://から始まる1行のリンクのみ。バナーコードの貼り付けはPC版を使ってください)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git identity
        run: |
          git config user.name "auto-lp-bot"
          git config user.email "auto-lp-bot@users.noreply.github.com"

      - name: Generate and publish LP
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AFFILIATE_URL: ${{ inputs.affiliate_url }}
        run: python3 tools/auto-lp/generate_and_publish_ci.py
