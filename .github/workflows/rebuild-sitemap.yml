name: Rebuild sitemap and LP index

on:
  push:
    branches: [main]
    paths:
      - "lp/auto/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild sitemap.xml, robots.txt, lp/auto/index.html
        run: python3 tools/sitemap/rebuild_sitemap.py

      - name: Commit changes if any
        run: |
          git config user.name "auto-lp-bot"
          git config user.email "auto-lp-bot@users.noreply.github.com"
          git add sitemap.xml robots.txt lp/auto/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Rebuild sitemap and LP index"
            git push origin HEAD:main
          fi
